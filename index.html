<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EMOJI CLASH</title>
<style>
:root{--bg:#0c0a18;--card:#17142b;--card2:#252144;--tx:#f4f2ff;--mut:#9a95c4;--acc:#ff4d8d;--gold:#ffd23f;--ok:#37d67a;--ng:#ff4d4d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ff;--card:#fff;--card2:#e8e4fb;--tx:#171433;--mut:#625d8c;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f1ff;--card:#fff;--card2:#e8e4fb;--tx:#171433;--mut:#625d8c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;overflow-x:hidden}
main{max-width:520px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:0;letter-spacing:.05em;background:linear-gradient(90deg,var(--acc),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.card{background:var(--card);border-radius:16px;padding:14px;margin:12px 0}
.mut{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{border:0;border-radius:99px;padding:12px 18px;font:inherit;font-weight:800;background:var(--acc);color:#fff;width:100%;margin-top:8px}
.btn.alt{background:var(--card2);color:var(--tx)}
.hide{display:none}
.inp{width:100%;margin:8px 0 0;padding:8px 10px;border-radius:10px;border:1px solid var(--card2);background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
.slot{background:var(--card2);border-radius:14px;padding:10px;margin:8px 0}
.slot .top{display:flex;align-items:center;gap:10px}
.slot .big{font-size:44px;width:64px;text-align:center}
.slot input{font:inherit;font-size:20px;width:80px;padding:6px 8px;border-radius:10px;border:1px solid var(--card);background:var(--bg);color:var(--tx);text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips span{font-size:24px;padding:3px 7px;border-radius:10px;background:var(--card);cursor:pointer}
.chips span:active{transform:scale(.9)}
.stat{font-size:13px;color:var(--mut)}.stat b{color:var(--tx)}
.mx{border-collapse:collapse;width:100%;font-size:12px;text-align:center;margin-top:8px}
.mx th,.mx td{padding:6px 3px;border:1px solid var(--card2)}
.mx td.w{background:rgba(55,214,122,.25);color:var(--ok);font-weight:900;font-size:18px}
.mx td.l{background:rgba(255,77,77,.2);color:var(--ng);font-weight:900;font-size:18px}
.mx td.eq{color:var(--mut)}
.tc{background:var(--card2);border-radius:10px;padding:8px 10px;margin:6px 0}
.rr{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;background:var(--card2);margin:6px 0}
.arena{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.f{text-align:center;position:relative;transition:transform .15s}
.f .em{font-size:78px;line-height:1.1}.f .sub{font-size:30px}
.f .nm{font-size:13px;color:var(--mut)}
.hp{height:14px;border-radius:7px;background:var(--card2);overflow:hidden;margin-top:6px}
.hp i{display:block;height:100%;width:100%;background:var(--ok);transition:width .35s,background .3s}
.hp.low i{background:var(--ng)}
.hpn{font-size:13px;font-weight:700}
.f.a0{transform:translateX(34px) scale(1.12)}.f.a1{transform:translateX(-34px) scale(1.12)}
.f.hit{animation:hit .3s}.f.dead{opacity:.35;filter:grayscale(1)}
.dmg{position:absolute;left:50%;top:10px;font-weight:900;font-size:26px;color:#fff;text-shadow:0 0 8px var(--ng),0 2px 0 #000;animation:rise .8s forwards;pointer-events:none}
.dmg.h{color:var(--ok);text-shadow:0 0 8px #0a5}.dmg.c{color:var(--gold);font-size:34px}
#tick{text-align:center;min-height:48px;font-weight:700;margin-top:10px}
#turn{text-align:center;font-weight:900;letter-spacing:.15em;color:var(--mut)}
.banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:40px;font-weight:900;z-index:60;pointer-events:none;color:var(--gold);text-shadow:0 0 24px #f80,0 3px 0 #000;animation:ban 1.3s forwards}
.verdict{text-align:center;font-size:44px;font-weight:900;margin:6px 0}
.verdict.w{color:var(--gold);text-shadow:0 0 24px var(--gold)}.verdict.l{color:var(--ng)}
.ttl{display:inline-block;background:var(--card2);padding:3px 10px;border-radius:99px;margin:3px 4px 0 0;font-size:13px}
#flash{position:fixed;inset:0;pointer-events:none;z-index:45;opacity:0}#flash.go{animation:fl .6s}
#cv{position:fixed;inset:0;pointer-events:none;z-index:50}
body.shake main{animation:shk .5s}body.dark main{filter:brightness(.25)}
main{transition:filter .15s}
@keyframes hit{50%{transform:translateX(8px) rotate(6deg);filter:brightness(2)}}
@keyframes rise{to{transform:translate(-50%,-60px);opacity:0}}
@keyframes ban{0%{opacity:0;transform:scale(.3)}20%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(1) translateY(-30px)}}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
@keyframes shk{20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(5px,-2px)}}
</style>
</head>
<body>
<div id="flash"></div><canvas id="cv"></canvas>
<main>
<div class="row"><h1>EMOJI CLASH</h1><button id="lang" class="btn alt" style="width:auto;margin:0;padding:6px 14px;font-size:13px">EN</button></div>
<div class="mut">絵文字ひとつで、世界を倒せ。</div>

<div id="start" class="card">
 <b>絵文字を3つ組み合わせて、自分だけの戦士を作ろう。</b>
 <p class="mut">戦闘は自動。HPが25%以下になると逆転技が発動することがあります。</p>
 <div id="chal" class="hide" style="color:var(--gold);font-weight:700;margin-bottom:8px"></div>
 <button class="btn alt hide" id="unchal">👻 友達戦をやめてゴースト戦に戻す</button>
 <button class="btn" id="sOn">🔊 音ありでプレイ</button>
 <button class="btn alt" id="sOff">🔇 音なしでプレイ</button>
 <div class="card" style="background:var(--card2);margin:14px 0 0">
  <b>👥 友達とリアルタイム対戦</b>
  <p class="mut" style="margin:4px 0 0">ルームを作って4桁の番号(またはリンク)を友達に送ると、お互いに戦士を決めて同時に対戦できます。</p>
  <button class="btn" id="mk">🏠 ルームを作る</button>
  <div style="display:flex;gap:8px"><input class="inp" id="rc" inputmode="numeric" maxlength="4" placeholder="ルーム番号4桁" style="flex:1"><button class="btn alt" id="jn" style="width:auto;margin-top:8px;background:var(--card)">参加</button></div>
  <label class="mut" style="display:block;margin-top:6px"><input type="checkbox" id="snd" checked> 🔊 音あり(ルーム・ランキング用)</label>
  <div class="mut" id="dbmsg"></div>
 </div>
 <div class="card" style="background:var(--card2);margin:10px 0 0">
  <b>🔗 挑戦状リンクで戦う</b>
  <p class="mut" style="margin:4px 0 0">友達の挑戦状リンクを貼り付けて、その戦士と戦います。</p>
  <input class="inp" id="lnk" placeholder="友達のリンクを貼り付け">
  <button class="btn alt" id="lnkb" style="background:var(--card)">読み込む</button>
 </div>
 <button class="btn alt" id="rk">🏆 ランキングを見る</button>
</div>

<div id="build" class="card hide">
 <b>戦士ビルダー</b><span class="mut"> 時間制限なし。決まったらバトル開始!</span>
 <div id="rbar" class="hide"></div><input id="nick" class="inp" maxlength="10" placeholder="ニックネーム(友達への挑戦状に載ります)">
 <div id="slots"></div><div id="info" class="card" style="background:var(--card2);margin:8px 0"></div>
 <details open style="margin:6px 0"><summary><b>📊 タイプ相性表</b></summary><div id="chart"></div></details>
 <div class="card" style="background:var(--card2);margin:8px 0">
  <div class="row"><b>YOUR WARRIOR</b><span style="font-size:30px" id="wv"></span></div>
  <div class="stat" id="st"></div>
 </div>
 <button class="btn" id="go">⚔️ バトル開始</button>
 <button class="btn alt" id="sendc">🔗 この戦士で友達に挑戦状を送る</button>
 <button class="btn alt" id="rnd">🎲 ランダム</button>
</div>

<div id="arena" class="card hide">
 <div id="turn"></div>
 <div class="arena">
  <div class="f" id="f0"><div class="em" id="e0"></div><div class="sub" id="s0"></div><div class="nm" id="n0"></div><div class="hp" id="h0"><i></i></div><div class="hpn" id="hn0"></div></div>
  <div class="f" id="f1"><div class="em" id="e1"></div><div class="sub" id="s1"></div><div class="nm" id="n1"></div><div class="hp" id="h1"><i></i></div><div class="hpn" id="hn1"></div></div>
 </div>
 <div id="tick"></div>
</div>

<div id="rank" class="card hide"></div>
<div id="wait" class="card hide"></div>
<div id="result" class="card hide"></div>
<div class="card hide" id="rec"></div>
</main>
<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const SHARE="";
// ★ Firebase Realtime Database のURLをここに入れる(例: https://xxxx-default-rtdb.asia-southeast1.firebasedatabase.app)
const FIREBASE_URL="https://emoji1clash-default-rtdb.asia-southeast1.firebasedatabase.app";
async function db(m,p,b){const r=await fetch(FIREBASE_URL.replace(/\/$/,"")+"/"+p+".json",{method:m,body:b===undefined?undefined:JSON.stringify(b)});if(!r.ok)throw new Error(r.status);return r.json()}
const okW=w=>{if(!Array.isArray(w)||w.length!==3)return null;const x=w.map(e=>first(String(e)));return x.every(Boolean)?x:null};
const PID=(()=>{try{let i=localStorage.getItem('ecid');if(!i){i=Math.random().toString(36).slice(2,8)+Date.now().toString(36);localStorage.setItem('ecid',i)}return i}catch(e){return Math.random().toString(36).slice(2,10)}})();
const norm=s=>String(s).replace(/\uFE0F/g,"");
const T=o=>{const r={};for(const k in o)r[norm(k)]=o[k];return r};
const BODY=T({"🐢":{d:"高耐久・低速",def:8,spd:.6,c:"def"},"🗿":{d:"超高防御・鈍足",def:10,spd:.5,c:"def"},"🐱":{d:"高速・紙耐久",def:2,spd:1.5,c:"dodge"},"🐉":{d:"バランス型",def:5,spd:1,c:"atk"},"💩":{d:"紙装甲・くさい",def:1,spd:1,c:"stink"},"🍣":{d:"やわらか・やや速い",def:3,spd:1.1,c:"heal"},"🤖":{d:"硬くて安定",def:6,spd:1,c:"dodge"},"👻":{d:"すばしこい",def:2,spd:1.3,c:"dodge"},"🦖":{d:"重量級",def:5,spd:.9,c:"atk"}});
const WEAP=T({"⚔️":{d:"単発高火力",atk:20,hits:1},"⚡":{d:"高速2連撃",atk:8,hits:2},"🎸":{d:"防御貫通",atk:11,hits:1,pierce:.6},"🔨":{d:"大打撃・やや鈍重",atk:25,hits:1,spdm:.8},"🏹":{d:"高クリティカル",atk:14,hits:1,crit:.3},"🔫":{d:"3連射",atk:6,hits:3},"🪄":{d:"魔法・防御貫通",atk:13,hits:1,pierce:.5}});
const ELEM=T({"🔥":{d:"継続ダメージ",burn:1,c:"x2"},"❄️":{d:"相手を減速",slow:1,c:"freeze"},"💚":{d:"毎ターン回復",heal:4,c:"heal"},"💀":{d:"ライフ吸収",steal:.3,c:"x2"},"☠️":{d:"毒",poison:1,c:"x2"},"🌀":{d:"15%で行動不能",stun:.15,c:"freeze"}});
const DB={d:"未登録(標準)",def:3,spd:1,c:"atk"},DW={d:"未登録(標準)",atk:12,hits:1},DE={d:"属性なし",c:null};
Object.assign(BODY,T({'🐘':{d:'超耐久の重戦車',def:9,spd:.5,c:'def'},'🦊':{d:'すばしこい策士',def:3,spd:1.3,c:'dodge'},'🐺':{d:'高速アタッカー',def:3,spd:1.4,c:'atk'},'🦍':{d:'パワー型',def:6,spd:.8,c:'atk'},'🐍':{d:'毒々しい小細工',def:2,spd:1.2,c:'stink'},'🐙':{d:'粘る回復役',def:4,spd:.9,c:'heal'},'🦅':{d:'超高速の空襲',def:2,spd:1.5,c:'dodge'},'🐻':{d:'頑丈な森の王',def:7,spd:.7,c:'def'},'🥷':{d:'最速の暗殺者',def:2,spd:1.6,c:'dodge'},'🧛':{d:'タフで回復',def:4,spd:1,c:'heal'},'🤡':{d:'ふざけた小細工',def:2,spd:1.1,c:'stink'}}));
Object.assign(WEAP,T({'🗡️':{d:'鋭い一撃',atk:16,hits:1,crit:.2},'🪓':{d:'重い斧・軽く貫通',atk:22,hits:1,pierce:.3,spdm:.9},'🔱':{d:'2連貫通',atk:10,hits:2,pierce:.3},'💣':{d:'超火力・超鈍重',atk:30,hits:1,spdm:.7},'🪃':{d:'2連・高クリ',atk:9,hits:2,crit:.2},'🥊':{d:'速い拳',atk:15,hits:1,spdm:1.1},'🍌':{d:'弱いが超クリ',atk:7,hits:1,crit:.5}}));
Object.assign(ELEM,T({'🌊':{d:'毎ターン+2回復・減速',heal:2,slow:1,c:'heal'},'⭐':{d:'クリティカル率+25%',crit:.25,c:'x2'},'🍀':{d:'20%で攻撃を回避',evade:.2,c:'dodge'},'🩸':{d:'継続ダメージ+吸血',burn:1,steal:.2,c:'x2'},'🌑':{d:'当てると相手の攻撃-40%',curse:1,c:'freeze'},'✨':{d:'防御貫通+30%',pierce:.3,c:'x2'}}));
const TYPE=T({'🐢':'守','🗿':'守','🤖':'守','🐘':'守','🐻':'守','🐱':'速','🐺':'速','🦅':'速','🥷':'速','🐉':'力','🦖':'力','🦍':'力','💩':'トリ','👻':'トリ','🦊':'トリ','🐍':'トリ','🤡':'トリ','🍣':'持','🐙':'持','🧛':'持'});
const N=T({'🐢':'カメ','🗿':'モアイ','🤖':'ロボ','🐘':'ゾウ','🐻':'クマ','🐱':'ネコ','🐺':'オオカミ','🦅':'ワシ','🥷':'ニンジャ','🐉':'ドラゴン','🦖':'きょうりゅう','🦍':'ゴリラ','💩':'うんち','👻':'ゆうれい','🦊':'キツネ','🐍':'ヘビ','🤡':'ピエロ','🍣':'おすし','🐙':'タコ','🧛':'ドラキュラ','⚔️':'剣','⚡':'雷','🎸':'ギター','🔨':'ハンマー','🏹':'弓','🔫':'ガン','🪄':'魔法の杖','🗡️':'短剣','🪓':'斧','🔱':'トライデント','💣':'爆弾','🪃':'ブーメラン','🥊':'パンチ','🍌':'バナナ','🔥':'炎','❄️':'氷','💚':'癒し','💀':'吸血','☠️':'毒','🌀':'めまい','🌊':'水流','⭐':'スター','🍀':'幸運','🩸':'出血','🌑':'呪い','✨':'聖なる光'});
const GB=T({'⚔️':['耐久の低い相手','回避・凍結で空振りしやすい'],'⚡':['回避持ち・防御の低い相手(2連撃で当てやすい)','防御が高い相手(1発が軽い)'],'🎸':['防御が高い相手(貫通)','紙装甲には火力不足'],'🔨':['防御が高い・動きが遅い相手','高速型(先に攻撃される)'],'🏹':['長期戦(クリティカルが積み上がる)','防御が高い相手'],'🔫':['回避持ち・防御の低い相手','防御が高い相手'],'🪄':['守り型(防御を貫通)','高速型'],'🗡️':['バランス型','防御が高い相手'],'🪓':['守り型(軽く貫通)','高速型'],'🔱':['守り型(2連貫通)','特になし(器用貧乏)'],'💣':['守り型・低速型','高速型(当たる前に倒される)'],'🪃':['回避持ち','防御が高い相手'],'🥊':['近づいて押し切る戦い','貫通・持久型'],'🍌':['運試し(超クリティカル狙い)','ほぼ全般(火力が低い)'],'🔥':['回復持ち・持久型','速攻型に押し切られる'],'❄️':['高速型(減速で封じる)','低速・守り型'],'💚':['長期戦・継続ダメージ','高火力の短期決戦'],'💀':['殴り合い','回避が多い相手'],'☠️':['守り型(防御を無視)','速攻で倒される'],'🌀':['2連撃・多段攻撃と相性◎','確率が低く安定しない'],'🌊':['速攻型(減速+回復)','高火力型'],'⭐':['高クリ武器(🏹🍌)','防御が硬い相手'],'🍀':['多段攻撃を避ける','火力不足になりがち'],'🩸':['持久戦','防御が高い相手'],'🌑':['パワー型(攻撃を弱める)','短期決戦'],'✨':['守り型(貫通UP)','速攻型']});
const BEATS={'守':['速','トリ'],'速':['持','力'],'力':['守','トリ'],'トリ':['速','持'],'持':['守','力']};
const TYPES={'守':{n:'守り型',i:'🛡️',c:'#4da3ff'},'速':{n:'速攻型',i:'⚡',c:'#ffd23f'},'力':{n:'パワー型',i:'💥',c:'#ff6b4a'},'トリ':{n:'トリック型',i:'🌀',c:'#c77dff'},'持':{n:'持久型',i:'🌿',c:'#37d67a'}};
const COL=Object.fromEntries(Object.entries(TYPES).map(([k,v])=>[k,v.c]));
const WHY={'守>速':'速い攻撃は硬い守りを抜けない','守>トリ':'小細工を真正面から受け止める','速>持':'回復される前に倒せる','速>力':'大技が出る前に畳みかける','力>守':'防御を力で砕く','力>トリ':'小細工ごと押し潰す','トリ>速':'速い攻撃をかわして翻弄','トリ>持':'回復を邪魔して調子を崩す','持>守':'火力の低い守りを長期戦で削る','持>力':'大技に耐えて回復で粘り勝つ'};
const adv=(f,o)=>f.type&&o.type?(BEATS[f.type].includes(o.type)?1.25:BEATS[o.type].includes(f.type)?.8:1):1;
const tnm=x=>TYPES[x].i+TYPES[x].n,lose=t=>Object.keys(BEATS).filter(k=>BEATS[k].includes(t));

else if(def.mode!=='ring')for(let i=0;i<n;i++){const s=document.createElement('span');s.className='gfx-p';const gl=def.mode==='glitch';

else if(def.mode==='rain'){const x=(Math.random()-.5)*110;kf=[{transform:C+`translate(${x}px,-120px) scale(.8)`,opacity:0},{opacity:1,offset:.2},{transform:C+`translate(${x*.8}px,30px) scale(1.3)`,opacity:1,offset:.8},{transform:C+`translate(${x*.8}px,40px) scale(1.6)`,opacity:0}]}
else if(def.mode==='inward'){const a=Math.random()*6.283,r=70+Math.random()*70;kf=[{transform:C+`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1.2)`,opacity:0},{opacity:1,offset:.25},{transform:C+'translate(0,0) scale(.2)',opacity:0}]}
else if(gl){const x=(Math.random()-.5)*150,y=(Math.random()-.5)*110;kf=[{transform:C+`translate(${x}px,${y}px)`,opacity:0},{opacity:1,offset:.2},{opacity:0,offset:.4},{opacity:1,offset:.6},{opacity:0}]}
else{const a0=Math.random()*6.283;kf=[0,.25,.5,.75,1].map(q=>{const a=a0+q*9,r=80*(1-q)+8;return{transform:C+`translate(${Math.cos(a)*r}px,${Math.sin(a)*r*.7}px) scale(${.6+q*.8})`,opacity:q>.85?0:1}})}

function wpn(ai,html,st,rank){const ar=$('#arena .arena'),a=$('#f'+ai),b=$('#f'+(1-ai));if(!ar||!html||!a||!b)return;

+ids.map(k=>{const o=!!S.titles[k],t=TITLES[k];return '<div class="tc'+(S.eq===k?' tsel':'')+'"'+(o?'':' style="opacity:.5"')+'>'+(o?tb(k):'<div class="mut" style="text-align:center">？？？</div>')+(t.d?'<div class="stat" style="text-align:center">'+esc(t.d)+'</div>':'')+'<button class="btn '+(S.eq===k?'alt':'')+'" data-t="'+k+'"'+(o?'':' disabled')+'>'+(!o?'未入手':S.eq===k?'外す':'装備する')+'</button></div>'}).join('')
+'<button class="btn alt" id="tback">← ホームへ</button>';
el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.eq=S.eq===b.dataset.t?null:b.dataset.t;save();renderTtl();if(rec.w+rec.l>0&&window.saveRank)saveRank()});

$('#gttl').onclick=()=>{show('none');$('#ttl').classList.remove('hide');renderTtl()};

['🏅 称号','🏅 Titles'],['🏅 称号:','🏅 Title: '],['🏅 獲得!','🏅 Obtained!'],['🎁 プレゼントが届きました!','🎁 You have a new gift!'],['ECの覇者達','Champions of EC'],
['現在の称号','Current title'],['称号なし','No title'],['外す','Remove'],['選んだ称号が、ランキングや対戦中の名前に表示されます。','Your selected title is shown on your name in ranking and battles.'],['ECの覇者に贈られる称号','A title awarded to the Champions of EC']];
